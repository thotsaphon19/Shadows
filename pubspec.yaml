name: shadows
description: Shadows by yannawut — Language Learning App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core:        ^2.24.2
  firebase_auth:        ^4.15.3
  cloud_firestore:      ^4.13.6
  google_sign_in:       ^6.2.1

  # Media
  audioplayers:         ^6.0.0
  flutter_sound:        ^9.2.13
  flutter_tts:          3.8.5
  video_player:         ^2.8.2

  # Speech Recognition
  speech_to_text:       ^7.0.0

  # Image
  cached_network_image: ^3.3.1

  # Utils
  http:                 ^1.2.1
  path_provider:        ^2.1.2
  permission_handler:   ^11.3.0
  share_plus:           ^7.2.2

flutter:
  uses-material-design: true
  assets:
    - assets/avatars/
    - assets/images/
    - assets/icons/
  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
        - asset: assets/fonts/NotoSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 700
